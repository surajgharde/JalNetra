name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q
      - name: Alembic migrations apply cleanly (TimescaleDB + PostGIS)
        run: |
          docker run -d --name pg -e POSTGRES_USER=jalnetra -e POSTGRES_PASSWORD=jalnetra -e POSTGRES_DB=jalnetra -p 5432:5432 timescale/timescaledb-ha:pg16
          for i in $(seq 1 30); do docker exec pg pg_isready -U jalnetra && break; sleep 2; done
          docker exec pg psql -U jalnetra -d jalnetra -c "CREATE EXTENSION IF NOT EXISTS postgis; CREATE EXTENSION IF NOT EXISTS timescaledb;"
          DATABASE_URL=postgresql+asyncpg://jalnetra:jalnetra@localhost:5432/jalnetra uv run alembic upgrade head
          DATABASE_URL=postgresql+asyncpg://jalnetra:jalnetra@localhost:5432/jalnetra uv run alembic downgrade base

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npx vite build

  image:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t jalnetra-backend:ci ./backend
