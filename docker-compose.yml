name: jalnetra

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-jalnetra}:${POSTGRES_PASSWORD:-jalnetra}@postgres:5432/${POSTGRES_DB:-jalnetra}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-jalnetra}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-jalnetra123}
  MINIO_BUCKET: ${MINIO_BUCKET:-jalnetra}
  MINIO_SECURE: "false"
  TITILER_URL: http://titiler:8000
  # GDAL: only issue range requests for the .tif we asked for (see plan §"How windowed reads work")
  GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
  CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif

x-backend: &backend
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    <<: *backend-env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_healthy

services:
  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO

  postgres:
    # TimescaleDB HA image ships PostGIS and preloads timescaledb.
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jalnetra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jalnetra}
      POSTGRES_DB: ${POSTGRES_DB:-jalnetra}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./infra/init-sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jalnetra} -d ${POSTGRES_DB:-jalnetra}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-jalnetra}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-jalnetra123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    # One-shot: create the bucket the pipeline writes chips/composites/briefs into.
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-jalnetra} ${MINIO_ROOT_PASSWORD:-jalnetra123} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-jalnetra} &&
      echo 'bucket ready'"

  titiler:
    image: ghcr.io/developmentseed/titiler:latest
    ports:
      - "8001:8000"
    environment:
      # Point GDAL/rasterio at MinIO for s3:// COG chips.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-jalnetra}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-jalnetra123}
      AWS_S3_ENDPOINT: minio:9000
      AWS_VIRTUAL_HOSTING: "FALSE"
      AWS_HTTPS: "NO"
      GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
      CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
      GDAL_HTTP_MERGE_CONSECUTIVE_RANGES: "YES"
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
